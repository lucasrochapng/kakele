<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Kakele - Monstros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="img-wiki/img-principal/cool.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .loot-img {
            width: auto;
            height: 30px;
            margin: 0 2px;
        }
    </style>


</head>
<body>

    <div class="banner">
        <img src="img/banner_esquerda.png" class="monster-left" alt="Monstro Esquerdo">
        <img src="img/banner_direita.png" class="monster-right" alt="Monstro Direito">
        <img src="img/banner_centro.png" class="logo" alt="Logo">

        <div class="btn-area">
        <button class="btn-custom">Baixar</button>
        <button class="btn-custom">Jogar</button>
        <button class="btn-custom">Pagamentos</button>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row g-3">

            <div class="col-md-12">

                <div class="sidebar">
                    <div class="menu menu-horizontal">
                        <a href="teste.html">Principal</a>
                        <a href="missoes.html">Missões</a>
                        <a href="monstros.html">Monstros</a>
                        <a href="chefes.html">Chefes</a>
                        <a href="itens.html">Itens</a>
                        <a href="outfits.html">Outfits</a>
                        <a href="pets.html">Mascotes</a>
                        <a href="montarias.html">Montarias</a>
                        <a href="npcs.html">NPCs</a>
                        <a href="rankings.html">Rankings</a>
                        <a href="faq.html">FAQ</a>
                    </div>
                </div>
            </div>

            <!-- Conteúdo central -->
            <div class="col-md-12">

                <div class="content">
                    <h2>
                        <img src="img-wiki/img-monstros/icone-monstros.png" alt="Ícone Kakele" style="height: 30px; vertical-align: middle; margin-right: 8px;">
                        Monstros
                    </h2>

                    <table class="monster-table" id="monsterTable">

                        <thead>
                            <tr>
                                <th class="sortable" onclick="sortTable(0)">
                                    <span class="th-content">Monstro <span class="sort-icon">⇅</span></span>
                                </th>
                                <th class="sortable" onclick="toggleEnergyFilter(event)">
                                    <span class="th-content">Energia <span class="sort-icon">⇅</span></span>
                                </th>
                                <th class="sortable" onclick="sortTable(2)">
                                    <span class="th-content">Experiência <span class="sort-icon">⇅</span></span>
                                </th>
                                <th class="sortable" onclick="sortTable(3)">
                                    <span class="th-content">Vida <span class="sort-icon">⇅</span></span>
                                </th>
                                <th class="sortable" onclick="sortTable(4)">
                                    <span class="th-content">Ouro <span class="sort-icon">⇅</span></span>
                                </th>
                                <th>Saque</th>
                            </tr>
                        </thead>

                        <tbody id="monsterTableBody">

                            <tr data-energy="natureza">
                                <td><img src="img-wiki/img-monstros/rato.png" class="monster-img"><br>Rato</td>
                                <td><img src="img-wiki/img-monstros/img-infos/energia-natureza.png" class="icon-small">Natureza</td>
                                <td><img src="img-wiki/img-principal/cool.png" class="icon-small">5</td>
                                <td><img src="img-wiki/img-monstros/img-infos/vida.png" class="icon-small">10</td>
                                <td><img src="img-wiki/img-monstros/img-infos/ouro.png" class="icon-small">1</td>
                                <td>
                                    <img src="img-wiki//img-monstros/img-loot/Card.png" class="loot-img">
                                    <img src="img-wiki//img-monstros/img-loot/queijo-mofado.png" class="loot-img">
                                    
                                </td>
                            </tr>

                            <tr data-energy="trevas">
                            <td><img src="img-wiki/img-monstros/skeleton.png" class="monster-img"><br>Esqueleto</td>
                            <td><img src="img-wiki/img-icons/trevas.png" class="icon-small">Trevas</td>
                            <td>180</td>
                            <td>450</td>
                            <td>80</td>
                            <td>
                                <img src="img-wiki/img-itens/item3.png" class="loot-img">
                            </td>
                            </tr>
                            <!-- Adicione mais monstros conforme necessário -->
                        </tbody>

                    </table>

                    <div id="energyFilter" class="energy-filter">
                    <button onclick="filterByEnergy('todas')">Todas</button>
                    <button onclick="filterByEnergy('natureza')">Natureza</button>
                    <button onclick="filterByEnergy('trevas')">Trevas</button>
                    <button onclick="filterByEnergy('luz')">Luz</button>
                    </div>

                </div>
                
            </div>



        </div>
    </div>


    <script>
        let sortDirections = [true, true, true, true]; // uma para cada coluna clicável
        const energyFilterBox = document.getElementById("energyFilter");

        function sortTable(columnIndex) {
            const table = document.getElementById("monsterTable");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);

            const direction = sortDirections[columnIndex] ? 1 : -1;
            sortDirections[columnIndex] = !sortDirections[columnIndex];

            rows.sort((a, b) => {
            let valA = a.cells[columnIndex].textContent.trim();
            let valB = b.cells[columnIndex].textContent.trim();

            if (!isNaN(valA) && !isNaN(valB)) {
                return (Number(valA) - Number(valB)) * direction;
            }

            return valA.localeCompare(valB) * direction;
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        function toggleEnergyFilter(event) {
            event.stopPropagation(); // impede o fechamento imediato
            const th = event.target.closest('th');
            const buttonRect = th.getBoundingClientRect();
            energyFilterBox.style.display = "block";
            energyFilterBox.style.left = buttonRect.left + "px";
            energyFilterBox.style.top = (window.scrollY + buttonRect.bottom) + "px";
        }


        function filterByEnergy(type) {
            const rows = document.querySelectorAll("#monsterTableBody tr");
            rows.forEach(row => {
            if (type === "todas" || row.dataset.energy === type) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
            });
            energyFilterBox.style.display = "none";
        }

        window.addEventListener('click', function (e) {
            if (!energyFilterBox.contains(e.target) && e.target.innerText !== 'Energia') {
            energyFilterBox.style.display = 'none';
            }
        });

    </script>


</body>
</html>
