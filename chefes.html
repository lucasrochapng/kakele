    <script>
        let sortDirections = [true, true, true, true]; // uma para cada coluna clicável
        const energyFilterBox = document.getElementById("energyFilter");

        function sortTable(columnIndex) {
            const table = document.getElementById("monsterTable");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);

            const direction = sortDirections[columnIndex] ? 1 : -1;
            sortDirections[columnIndex] = !sortDirections[columnIndex];

            rows.sort((a, b) => {
            let valA = a.cells[columnIndex].textContent.trim();
            let valB = b.cells[columnIndex].textContent.trim();

            if (!isNaN(valA) && !isNaN(valB)) {
                return (Number(valA) - Number(valB)) * direction;
            }

            return valA.localeCompare(valB) * direction;
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        function toggleEnergyFilter(event) {
            event.stopPropagation(); // impede o fechamento imediato
            const th = event.target.closest('th');
            const buttonRect = th.getBoundingClientRect();
            energyFilterBox.style.display = "block";
            energyFilterBox.style.left = buttonRect.left + "px";
            energyFilterBox.style.top = (window.scrollY + buttonRect.bottom) + "px";
        }


        function filterByEnergy(type) {
            const rows = document.querySelectorAll("#monsterTableBody tr");
            rows.forEach(row => {
            if (type === "todas" || row.dataset.energy === type) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
            });
            energyFilterBox.style.display = "none";
        }

        window.addEventListener('click', function (e) {
            if (!energyFilterBox.contains(e.target) && e.target.innerText !== 'Energia') {
            energyFilterBox.style.display = 'none';
            }
        });

    </script>
