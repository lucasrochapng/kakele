<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enfurecida</title>
    <link rel="icon" href="img/banner.png" type="image/x-icon">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: black;
        }
        .navbar {
            background-color: #007bff;
        }
        .navbar .nav-link {
            color: white;
        }
        .navbar .nav-link:hover {
            color: #e0e0e0;
        }
        .hero {
            background-color: black; /* Seção de Apresentação em Preto */
            color: white;
            /* padding: 100px 0; */
        }
        .hero .content {
            display: flex;
            /* align-items: flex-end;  */
            align-items: center;
        }
        .hero .content .text-col {
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centraliza verticalmente o texto */
            height: 100%; /* Para ocupar toda a altura da coluna */
        }
        .hero .content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px; /* Borda arredondada para a imagem */
        }
        .footer {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        /* cards */
        .card-custom {
        border-radius: 1rem;
        background-color: #1c1c1c;
        color: white;
        }
        .image-square {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 0.5rem;
        }
        .info-text {
        margin-left: 1rem;
        flex: 1;
        }
        .location-container {
        position: relative;
        display: inline-block;
        }
        .location-image {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 200px;
        height: auto;
        border: 1px solid #333;
        border-radius: 0.5rem;
        z-index: 10;
        }
        .location-container:hover .location-image {
        display: block;
        }
        
    </style>
</head>
<body>

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">ZENIN</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/index.html">INICIO</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="simuladorlucro/index.html">SIMULADOR DE LUCRO</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="enfurecida/index.html">ENFURECIDA</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- CARDS -->

    <div class="card card-custom p-3 shadow-sm">
        <div class="d-flex align-items-start">
          <img src="./img/cultista-do-deserto.png" alt="Imagem" class="image-square">
          <div class="info-text">
            <h5 class="mb-2">Cultista do Deserto</h5>
            <p class="mb-1"><strong>Level:</strong> 800</p>
            <p class="mb-1"><strong>Alvo:</strong> 320 Cristais Cultistas</p>
            <p class="mb-0">
              <strong>Localização:</strong> 
              <span class="location-container" id="localizacao">
                000.000.01
                <img src="/enfurecida/map/mapa-cultista.png" class="location-image" id="location-img" alt="Mapa">
              </span>
            </p>
          </div>
        </div>
      </div>

      <script>
        // Exibe a imagem ao tocar (mobile)
        const container = document.getElementById('localizacao');
        const image = document.getElementById('location-img');
    
        // Toggle manual para toque em celular
        container.addEventListener('click', function (e) {
          e.stopPropagation(); // impedir propagação para o body
          image.style.display = (image.style.display === 'block') ? 'none' : 'block';
        });
    
        // Oculta ao clicar fora
        document.body.addEventListener('click', function () {
          image.style.display = 'none';
        });
      </script>
    
</body>
</html>
